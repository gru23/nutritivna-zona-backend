spring.application.name=nutritivna_zona

server.port=${PORT}
spring.datasource.url=${MYSQL_SERVER_URL}
spring.datasource.username=${MYSQL_ROOT_USERNAME}
spring.datasource.password=${MYSQL_ROOT_PASSWORD}
logging.file.path=${MY_LOGGING_FILE_PATH}
logging.level.root=${MY_LOGGING_LEVEL}

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.config.import=optional:file:./.env[.properties]
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger

#logging.file.name=nutri.log


logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR

authorization.token.header.name=Authorization
authorization.token.header.prefix=Bearer
authorization.token.secret=
authorization.token.expiration-time=36000000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nutritivnaz@gmail.com
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
